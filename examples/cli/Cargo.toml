[package]
name = "digidocpp-example-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
exclude = ["tests/"]
publish = false

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
digidocpp = { path = "../.." }
mime_guess = "2.0.5"
rpassword = "7.5.4"
x509-parser = "0.18.1"

[build-dependencies]
libdigidocpp-build = { path = "../../libdigidocpp-build" }

[dev-dependencies]
predicates = "3.1.4"
regex = "1.13.1"
rstest = "0.27.0"
serial_test = "4.0.1"
tempfile = "3.27.0"

[features]
# Enables tests that need network access. Not public API.
_online_tests = []
