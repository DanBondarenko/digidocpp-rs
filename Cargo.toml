[workspace]
members = ["libdigidocpp-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package]
name = "libdigidocpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libdigidocpp-sys = { path = "libdigidocpp-sys" }
cxx = "1.0.164"
thiserror = "2.0.18"
num_enum = "0.7.6"

[dev-dependencies]
bon = "3.9.1"
itertools = "0.14.0"
serial_test = "3.3.1"

[workspace.lints.rust]
missing_docs = "allow" # TODO: Turn on before publishing
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
exhaustive_structs = "warn"
exhaustive_enums = "warn"
missing_errors_doc = "allow" # TODO: Turn on before publishing
cargo_common_metadata = "allow" # TODO: Turn on before publishing

[lints]
workspace = true
