[workspace]
members = ["libdigidocpp-sys", "libdigidocpp-build"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package]
name = "libdigidocpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libdigidocpp-sys = { path = "libdigidocpp-sys" }
cxx = "1.0.177"
thiserror = "2.0.20"
secrecy = "0.10.3"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from"] }

[build-dependencies]
libdigidocpp-build = { path = "libdigidocpp-build" }

[dev-dependencies]
bon = "3.10.1"
hex = "0.4.3"
httpmock = "0.8.3"
itertools = "0.15.0"
memory-stats = "1.2.0"
rand = "0.10.3"
rstest = "0.27.0"
serde_json = "1.0.151"
serial_test = "4.0.1"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
x509-parser = "0.18.1"

[features]
_online_tests = []
_rsa_pss_validation_tests = []

[workspace.lints.rust]
missing_docs = "allow" # TODO: Turn on before publishing
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
exhaustive_structs = "warn"
exhaustive_enums = "warn"
missing_errors_doc = "allow" # TODO: Turn on before publishing
cargo_common_metadata = "allow" # TODO: Turn on before publishing

[lints]
workspace = true
