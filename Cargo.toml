[workspace]
members = [
    "libdigidocpp-sys",
    "libdigidocpp-build",
    "examples/cli",
    "examples/server",
]

[workspace.package]
version = "0.1.0"
authors = ["Dan Bondarenko <dan.bondarenko.1@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/DanBondarenko/digidocpp-rs"

[package]
name = "digidocpp"
description = "Safe bindings to libdigidocpp: create and validate eIDAS digital signatures in ASiC-E/XAdES containers"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["digidoc", "digital-signature", "xades", "asice", "eidas"]
categories = ["api-bindings", "cryptography"]
publish.workspace = true
exclude = [
    "tests/",
    ".config/",
    ".github/",
    ".clang-format",
    ".clang-format-ignore",
    ".clang-tidy",
    ".gitattributes",
    ".gitignore",
    "clippy.toml",
    "deny.toml",
    "rust-toolchain.toml",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
libdigidocpp-sys = { path = "libdigidocpp-sys", version = "0.1.0" }
cxx = "1.0.177"
thiserror = "2.0.20"
secrecy = "0.10.3"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from"] }

[build-dependencies]
libdigidocpp-build = { path = "libdigidocpp-build", version = "0.1.0" }

[dev-dependencies]
bon = "3.10.1"
hex = "0.4.3"
httpmock = "0.8.3"
itertools = "0.15.0"
memory-stats = "1.2.0"
rand = "0.10.3"
rstest = "0.27.0"
serde_json = "1.0.151"
serial_test = "4.0.1"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
x509-parser = "0.18.1"

[features]
# Enables tests that need network access. Not public API.
_online_tests = []
# Enables the RSA-PSS signing test. Needs xmlsec1 1.3 or newer. Not public API.
_rsa_pss_validation_tests = []

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
exhaustive_structs = "warn"
exhaustive_enums = "warn"

[lints]
workspace = true
