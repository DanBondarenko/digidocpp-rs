name: Install libdigidocpp
description: Install libdigidocpp-dev from installer.id.ee apt repository

inputs:
  codename:
    description: Ubuntu release codename
    default: noble
  extra-packages:
    description: Extra packages to install (separate by space)
    default: ""

runs:
  using: composite
  steps:
    - name: Install libdigidocpp from RIA repository
      shell: bash
      env:
        CODENAME: ${{ inputs.codename }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        curl -fsSL https://installer.id.ee/media/install-scripts/C6C83D68.pub |
          sudo gpg --dearmor -o /etc/apt/keyrings/ria-repository.gpg
        echo "deb [signed-by=/etc/apt/keyrings/ria-repository.gpg] https://installer.id.ee/media/ubuntu/ $CODENAME main" |
          sudo tee /etc/apt/sources.list.d/ria-repository.list
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y libdigidocpp-dev $EXTRA_PACKAGES
