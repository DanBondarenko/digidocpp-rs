name: Install libdigidocpp (apt)
description: Install libdigidocpp-dev from installer.id.ee apt repository

runs:
  using: composite
  steps:
    - name: Install libdigidocpp from installer.id.ee repository
      shell: bash
      env:
        RIA_REPO_KEY_URL: https://installer.id.ee/media/install-scripts/C6C83D68.pub
      run: |
        . /etc/os-release
        curl -fsSL "$RIA_REPO_KEY_URL" |
          sudo gpg --dearmor -o /etc/apt/keyrings/ria-repository.gpg
        echo "deb [signed-by=/etc/apt/keyrings/ria-repository.gpg] https://installer.id.ee/media/ubuntu/ $VERSION_CODENAME main" |
          sudo tee /etc/apt/sources.list.d/ria-repository.list
        sudo apt-get update
        sudo apt-get install -y libdigidocpp-dev
