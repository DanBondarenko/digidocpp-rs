name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt
        if: runner.os == 'Linux'

      - uses: ./.github/actions/install-libdigidocpp-pkg
        if: runner.os == 'macOS'

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Check Rust format
        run: cargo fmt --all --check

      - name: Install clang-format
        if: ${{ !cancelled() }}
        run: pipx install clang-format==23.1.1

      - name: Check C++ format
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt
        if: runner.os == 'Linux'

      - uses: ./.github/actions/install-libdigidocpp-pkg
        if: runner.os == 'macOS'

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  clang-tidy:
    name: Clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt
        if: runner.os == 'Linux'

      - uses: ./.github/actions/install-libdigidocpp-pkg
        if: runner.os == 'macOS'

      - name: Install bear (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bear

      - name: Install bear (macOS)
        if: runner.os == 'macOS'
        run: brew install bear

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install clang-tidy
        run: pipx install clang-tidy==23.1.3

      - name: Generate compile_commands.json
        run: |
          cargo clean -p libdigidocpp-sys
          bear -- cargo build -p libdigidocpp-sys --all-features --locked

      - name: Select macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Clang-tidy
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-tidy -p .

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt
        if: runner.os == 'Linux'

      - uses: ./.github/actions/install-libdigidocpp-pkg
        if: runner.os == 'macOS'

      - name: Read MSRV
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check
        run: cargo check -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --locked

  docs:
    name: Docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt
        if: runner.os == 'Linux'

      - uses: ./.github/actions/install-libdigidocpp-pkg
        if: runner.os == 'macOS'

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  docs-rs:
    name: Docs.rs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Docs
        run: cargo doc -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --no-deps --locked

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Package
        run: cargo package -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --locked

  online:
    name: Online tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp-apt

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --all-features
