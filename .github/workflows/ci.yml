name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Ubuntu ${{ matrix.version }})
    runs-on: ubuntu-${{ matrix.version }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "22.04"
            codename: jammy
          - version: "24.04"
            codename: noble
          - version: "26.04"
            codename: resolute
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp
        with:
          codename: ${{ matrix.codename }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: ${{ matrix.codename }}

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Check Rust format
        run: cargo fmt --all --check

      - name: Install clang-format
        if: ${{ !cancelled() }}
        run: pipx install clang-format==23.1.1

      - name: Check C++ format
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  clang-tidy:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp
        with:
          extra-packages: bear

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install clang-tidy
        run: pipx install clang-tidy==23.1.3

      - name: Generate compile_commands.json
        run: |
          cargo clean -p libdigidocpp-sys
          bear -- cargo build -p libdigidocpp-sys --all-features --locked

      - name: Clang-tidy
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-tidy -p .

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp

      - name: Read MSRV
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check
        run: cargo check -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --locked

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  docs-rs:
    name: Docs.rs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Docs
        run: cargo doc -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --no-deps --locked

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Package
        run: cargo package -p digidocpp -p libdigidocpp-sys -p libdigidocpp-build --locked

  online:
    name: Online tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-libdigidocpp

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --all-features
