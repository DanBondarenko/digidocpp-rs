[package]
name = "libdigidocpp-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "digidocpp"
publish.workspace = true
exclude = ["tests/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[dependencies]
cxx = "1.0.177"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
cxx-build = "1.0.177"
libdigidocpp-build = { path = "../libdigidocpp-build" }

[features]
# For this crate's own tests. Not public API.
_test_util = []

[dev-dependencies]
libdigidocpp-sys = { path = ".", features = ["_test_util"] }
rand = "0.10.3"

[lints]
workspace = true
